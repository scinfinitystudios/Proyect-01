<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101820">
  <meta name="description" content="FPS 3D para Android y navegador móvil.">
  <title>FPS Mobile</title>
  <link rel="stylesheet" href="./styles.css">
  <link rel="manifest" href="./manifest.webmanifest">
  <script>
    (() => {
      let booted = false;
      const showError = (message) => {
        const loading = document.getElementById("loading");
        if (!loading || booted) return;
        const spinner = loading.querySelector(".loader");
        if (spinner) spinner.hidden = true;
        const heading = loading.querySelector("h1");
        const status = document.getElementById("loading-status");
        if (heading) heading.textContent = "No se pudo iniciar FPS Mobile";
        if (status) status.textContent = message || "Error desconocido al cargar el motor.";
        loading.classList.add("startup-error");
        loading.classList.remove("hidden");
      };
      window.__FPS_SHOW_ERROR__ = showError;
      window.__FPS_MARK_BOOTED__ = () => {
        booted = true;
        clearTimeout(window.__FPS_BOOT_TIMEOUT__);
      };
      window.addEventListener("error", (event) => {
        if (event.target && event.target !== window) {
          const failedUrl = event.target.src || event.target.href || "recurso desconocido";
          showError("No se pudo cargar: " + failedUrl);
          return;
        }
        showError(event.message || "Error JavaScript al iniciar el motor.");
      }, true);
      window.addEventListener("unhandledrejection", (event) => {
        const reason = event.reason;
        showError(reason && reason.message ? reason.message : String(reason || "Falló una operación interna del motor."));
      });
      window.__FPS_BOOT_TIMEOUT__ = setTimeout(() => {
        if (!booted) showError("El módulo del juego no respondió. Revisa la carga de JavaScript y Three.js.");
      }, 20000);
    })();
  </script>
</head>
<body>
  <main id="game-root">
    <canvas id="game-canvas" aria-label="Vista 3D del juego"></canvas>
    <section id="loading" class="overlay" aria-live="polite">
      <div class="loader"></div>
      <h1>Preparando el motor</h1>
      <p id="loading-status">Iniciando gráficos 3D…</p>
    </section>
    <section id="compatibility" class="overlay hidden" role="alert">
      <h1>Gráficos 3D no disponibles</h1>
      <p>Este dispositivo o su WebView no permite iniciar WebGL2. Actualiza Android System WebView y vuelve a intentarlo.</p>
    </section>
    <section id="settings" class="hud">
      <label>Calidad
        <select id="quality-select">
          <option value="auto">Automática</option>
          <option value="low">Baja</option>
          <option value="medium">Media</option>
          <option value="high">Alta</option>
        </select>
      </label>
      <label>FPS
        <select id="fps-select">
          <option value="60">60 FPS</option>
          <option value="30">30 FPS</option>
        </select>
      </label>
      <label class="toggle"><input id="battery-toggle" type="checkbox"> Ahorro</label>
      <button id="debug-toggle" type="button" aria-pressed="false">Diagnóstico</button>
    </section>
    <aside id="debug-panel" class="debug hidden" aria-live="off"></aside>
    <p id="game-message">FPS Mobile — escenario de prueba.</p>
  </main>
  <script type="module" src="./js/main.js" onerror="window.__FPS_SHOW_ERROR__ && window.__FPS_SHOW_ERROR__('No se pudo cargar js/main.js. Comprueba los archivos incluidos en la APK.')"></script>
</body>
</html>
