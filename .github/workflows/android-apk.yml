name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [android-apk]

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el proyecto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Preparar el motor web dentro del APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets/www/js/vendor
          cp index.html styles.css manifest.webmanifest app/src/main/assets/www/
          cp -R js app/src/main/assets/www/
          curl --fail --location --retry 3 --retry-delay 2 \
            https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js \
            --output app/src/main/assets/www/js/vendor/three.module.js
          sed -i 's#https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js#../vendor/three.module.js#' \
            app/src/main/assets/www/js/engine/renderer.js
          grep -Fq 'from "../vendor/three.module.js"' app/src/main/assets/www/js/engine/renderer.js
          test -s app/src/main/assets/www/index.html
          test -s app/src/main/assets/www/js/main.js
          test -s app/src/main/assets/www/js/vendor/three.module.js
          while IFS= read -r file; do
            node --input-type=module --check < "$file"
          done < <(find app/src/main/assets/www/js -type f -name '*.js' ! -path '*/vendor/*' | sort)
          echo "Recursos web preparados y sintaxis JavaScript validada."

      - name: Compilar APK de prueba
        run: gradle --no-daemon clean assembleDebug

      - name: Verificar contenido del APK
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -l "$APK" | grep -Fq 'assets/www/index.html'
          unzip -l "$APK" | grep -Fq 'assets/www/js/main.js'
          unzip -l "$APK" | grep -Fq 'assets/www/js/vendor/three.module.js'
          echo "APK generado y recursos principales incluidos."

      - name: Publicar APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: FPS-Mobile-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
