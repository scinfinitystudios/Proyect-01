name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [android-apk]

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el proyecto
        uses: actions/checkout@v4
      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Empaquetar el motor web dentro del APK
        shell: bash
        run: |
          mkdir -p app/src/main/assets/www/js/vendor
          cp index.html styles.css manifest.webmanifest app/src/main/assets/www/
          cp -R js app/src/main/assets/www/
          curl -fL https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js -o app/src/main/assets/www/js/vendor/three.module.js
          sed -i 's#https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js#./vendor/three.module.js#' app/src/main/assets/www/js/engine/renderer.js
      - name: Compilar APK de prueba
        run: gradle --no-daemon assembleDebug
      - name: Publicar APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: FPS-Mobile-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
